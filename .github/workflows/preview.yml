# Uploads a preview of each pull request to the Cloudflare Worker "bellintani-work" without touching production.
# The link (https://<branch>-bellintani-work.<subdomain>.workers.dev) is printed in the job log and summary.
name: Preview on Cloudflare

on:
  pull_request:

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c216143adc87c8c0a6cfaed0a4ba990c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload preview
        run: |
          alias=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
          npx -y wrangler@4 versions upload --preview-alias "$alias" 2>&1 | tee out.txt
          { echo "### Preview"; grep -Eo 'https://[^ ]+workers\.dev' out.txt | sort -u; } >> "$GITHUB_STEP_SUMMARY"
