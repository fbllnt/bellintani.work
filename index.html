<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Bellintani</title>
<meta name="description" content="Bellintani — multidisciplinary designer and art director.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bellintani.work/">
<meta property="og:title" content="Bellintani">
<meta property="og:description" content="Multidisciplinary designer, art director, ADHD, Music Freak, father of a little 7 year old princess and who knows what else.">
<meta property="og:image" content="https://bellintani.work/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/style.css?v=202610272235">
</head>
<body>

<nav class="corners" id="corners" aria-label="Main">
  <a class="c-tl" href="#top"><span class="swap"><span data-bind="nameYear"></span><span class="c-alt" data-bind="copyright"></span><span class="c-back" data-i18n="backHome"></span></span></a>
  <div class="c-tr"><a class="swap" href="#work"><span data-i18n="work"></span><span data-bind="workCount"></span></a><a class="swap" href="#about"><span data-i18n="aboutNav"></span><span data-i18n="aboutNav"></span></a><button class="swap" id="music-btn" type="button" aria-expanded="false" aria-controls="music" data-i18n-label="musicLabel"><span data-i18n="music"></span><span data-i18n="music"></span></button><button class="lang swap" id="lang" type="button"><span data-i18n="langSwitch"></span><span data-i18n="langSwitch"></span></button></div>
  <div class="c-bl" id="social-corner"></div>
  <a class="c-br talk swap" href="#contact"><span data-i18n="letsTalk"></span><span><span class="ar">→</span> <span data-i18n="letsTalk"></span> <span class="ar">←</span></span></a>
</nav>
<!-- Suggested music: a small Spotify player that drops down from the corner menu -->
<aside class="music" id="music" hidden data-i18n-label="musicLabel">
  <div class="music-head mono"><span id="music-title"></span><button type="button" id="music-close" data-i18n-label="close">×</button></div>
  <button class="music-swap mono" id="music-swap" type="button" hidden></button>
  <div class="music-frame" id="music-frame"></div>
</aside>

<div class="home">
<header class="stage" id="top">
  <div class="loader" id="loader" aria-hidden="true"></div>
  <div class="panel" style="--d:3.8s;background:var(--fg)"></div>
  <div class="panel" style="--d:3.95s;background:var(--blue)"></div>
  <div class="panel" style="--d:4.1s;background:var(--panel)"></div>
  <div class="panel" style="--d:4.25s;background:var(--bg)"></div>
  <div class="head">
    <h1 class="name" id="name"></h1>
    <div class="tag mono"><b data-bind="tagline"></b><span id="subline"></span></div>
  </div>
  <button class="skip mono" id="skip" type="button" data-i18n="skip"></button>
  <!-- Scroll cue: two chevrons cascading down; fades away once the page moves -->
  <a class="cue" id="cue" href="#work" data-i18n-label="scrollDown"><svg viewBox="0 0 24 26" width="24" height="26" aria-hidden="true"><path d="M3 3l9 8 9-8"/><path d="M3 14l9 8 9-8"/></svg></a>
</header>
</div>

<main class="gut">
  <section class="sec works" id="work">
    <div class="sec-head">
      <h2 class="h2"><span data-i18n="work"></span><sup data-bind="workCount"></sup></h2>
      <div class="seg mono" role="group" data-i18n-label="view">
        <button type="button" id="view-index" aria-pressed="true" data-i18n="index"></button>
        <button type="button" id="view-grid" aria-pressed="false" data-i18n="grid"></button>
      </div>
    </div>
    <ul class="index" id="index"></ul>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sec" id="services">
    <div class="sec-head">
      <h2 class="h2" data-i18n="services"></h2>
      <button class="replay mono swap" id="replay" type="button"><span data-i18n="replay"></span><span data-i18n="replay"></span></button>
    </div>
    <ul class="services mono" id="services-list"></ul>
  </section>

  <!-- About, run as end credits -->
  <section class="sec credits" id="about">
    <div class="sec-head">
      <h2 class="h2" data-i18n="aboutTitle"></h2>
      <a class="mono swap" href="#contact"><span data-i18n="skipCredits"></span><span data-i18n="skipCredits"></span></a>
    </div>
    <p class="credits-intro" id="credits-intro"></p>
    <div class="roll" id="credits"></div>
  </section>

  <footer class="foot" id="contact">
    <span class="mono muted" data-i18n="gotProject"></span><br>
    <a class="big" id="mail-big" href="#contact"><span data-i18n="letsTalk"></span><span class="arr">↗</span></a>
  </footer>
</main>

<article class="case gut" id="case" aria-live="polite"></article>
<div class="wipe" id="wipe" aria-hidden="true"></div>

<script src="js/content.js?v=202610272235"></script>
<script src="js/main.js?v=202610272235"></script>
</body>
</html>
